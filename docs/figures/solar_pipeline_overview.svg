
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#222}
.title{font-size:22px;font-weight:700}
.sub{font-size:14px;fill:#444}
.box{fill:#fbfcfe;stroke:#6f93c6;stroke-width:2}
.green{fill:#f6fbf7;stroke:#7cb67d}
.orange{fill:#fffaf2;stroke:#d5a451}
.purple{fill:#faf8ff;stroke:#8b78c9}
.line{stroke:#222;stroke-width:2;fill:none;marker-end:url(#a)}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6Z" fill="#222"/>
</marker>
</defs>
<rect class="box" x="240.0" y="30" rx="14" ry="14" width="420" height="90"/>
<text class="title" x="450.0" y="66" text-anchor="middle">SolarMagix</text>
<text class="sub" x="450.0" y="96" text-anchor="middle">13 CSV Files</text>
<rect class="box orange" x="240.0" y="150" rx="14" ry="14" width="420" height="90"/>
<text class="title" x="450.0" y="186" text-anchor="middle">Data Preparation</text>
<text class="sub" x="450.0" y="216" text-anchor="middle">Cleaning • Capacity Factor • Feature Engineering</text>
<rect class="box orange" x="240.0" y="270" rx="14" ry="14" width="420" height="90"/>
<text class="title" x="450.0" y="306" text-anchor="middle">Feature Variants</text>
<text class="sub" x="450.0" y="336" text-anchor="middle">Variant A: 12 features, past-only</text>
<text class="sub" x="450.0" y="358" text-anchor="middle">Variant B: 17 features, perfect-forecast</text>
<rect class="box green" x="240.0" y="390" rx="14" ry="14" width="420" height="90"/>
<text class="title" x="450.0" y="426" text-anchor="middle">Station-based Client Datasets</text>
<text class="sub" x="450.0" y="456" text-anchor="middle">(7 stations)</text>
<rect class="box purple" x="240.0" y="510" rx="14" ry="14" width="420" height="90"/>
<text class="title" x="450.0" y="546" text-anchor="middle">Per-Client Temporal Split</text>
<text class="sub" x="450.0" y="576" text-anchor="middle">70 / 15 / 15</text>
<line class="line" x1="450" y1="120" x2="450" y2="140"/>
<line class="line" x1="450" y1="240" x2="450" y2="260"/>
<line class="line" x1="450" y1="360" x2="450" y2="380"/>
<line class="line" x1="450" y1="480" x2="450" y2="500"/>
<line x1="450" y1="600" x2="450" y2="600" stroke="#222" stroke-width="2"/>
<line x1="120" y1="600" x2="780" y2="600" stroke="#222" stroke-width="2"/>
<line class="line" x1="120" y1="600" x2="120" y2="640"/>
<rect class="green" x="40" y="640" rx="14" ry="14" width="160" height="90"/>
<text class="title" x="120.0" y="676" text-anchor="middle">Persistence</text>
<text class="sub" x="120.0" y="706" text-anchor="middle">(baseline)</text>
<line class="line" x1="320" y1="600" x2="320" y2="640"/>
<rect class="green" x="240" y="640" rx="14" ry="14" width="160" height="90"/>
<text class="title" x="320.0" y="676" text-anchor="middle">Local</text>
<text class="sub" x="320.0" y="706" text-anchor="middle">(7 models)</text>
<line class="line" x1="520" y1="600" x2="520" y2="640"/>
<rect class="green" x="440" y="640" rx="14" ry="14" width="160" height="90"/>
<text class="title" x="520.0" y="676" text-anchor="middle">Federated</text>
<text class="sub" x="520.0" y="706" text-anchor="middle">(FedAvg, FedProx)</text>
<line class="line" x1="720" y1="600" x2="720" y2="640"/>
<rect class="green" x="640" y="640" rx="14" ry="14" width="160" height="90"/>
<text class="title" x="720.0" y="676" text-anchor="middle">Centralized</text>
<text class="sub" x="720.0" y="706" text-anchor="middle">(pooled)</text>
<line x1="120" y1="730" x2="720" y2="730" stroke="#222" stroke-width="2"/>
<line class="line" x1="420" y1="730" x2="420" y2="790"/>
<rect class="purple" x="240" y="790" rx="14" ry="14" width="360" height="100"/>
<text class="title" x="420.0" y="826" text-anchor="middle">Evaluation</text>
<text class="sub" x="420.0" y="856" text-anchor="middle">(validation split)</text>
<text class="sub" x="420.0" y="878" text-anchor="middle">MAE • RMSE • Skill</text>
</svg>