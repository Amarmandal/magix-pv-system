[project]
name = "solarfl"
version = "1.1.0"
description = "Reproducible federated learning experiments for day-ahead photovoltaic forecasting"
readme = "README.md"
requires-python = ">=3.12.12"
license = "MIT"
authors = [
    { name = "Amar Kumar Mandal", email = "amarkumar.mandal@stu.khas.edu.tr" },
    { name = "Yuvraj Chaudhary", email = "yuvraj.chaudhary@fau.de" },
]
keywords = [
    "federated learning",
    "photovoltaics",
    "time-series forecasting",
    "FedAvg",
    "FedProx",
]
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
]

[project.urls]
Repository = "https://github.com/Amarmandal/magix-internship"
Dataset = "https://doi.org/10.17632/4zgsckxpdy.2"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solarfl"]
